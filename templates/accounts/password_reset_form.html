{% extends "base.html" %}

{% block title %}Reset password — CodeQuest{% endblock %}

{% block content %}
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <a href="{% url 'home' %}" class="brand" aria-label="CodeQuest home">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    </span>
                    <span class="brand-text">Code<span class="brand-accent">Quest</span></span>
                </a>
            </div>

            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>

            <form method="post" class="form" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-block btn-lg">Send reset link</button>
            </form>

            <div class="auth-footer">
                Remembered it? <a href="{% url 'login' %}">Back to login</a>
            </div>
        </div>
    </div>
{% endblock %}
