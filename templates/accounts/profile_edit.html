{% extends "base.html" %}

{% block title %}Edit Profile — CodeQuest{% endblock %}

{% block content %}
    <a href="{% url 'profile' %}">&larr; Back to profile</a>

    <h1>Edit profile</h1>
    <form method="post" enctype="multipart/form-data" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save</button>
    </form>
{% endblock %}
