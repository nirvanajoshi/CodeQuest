{% extends "base.html" %}

{% block title %}Edit Profile — CodeQuest{% endblock %}

{% block content %}
    <p><a href="{% url 'profile' %}" class="card-link">&larr; Back to profile</a></p>

    <header class="page-header">
        <div>
            <h1 class="page-title">Edit profile</h1>
            <p class="page-subtitle">Update your avatar, bio, and other details.</p>
        </div>
    </header>

    <form method="post" enctype="multipart/form-data" class="form panel" style="max-width: 640px;">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions-row">
            <button type="submit" class="btn">Save changes</button>
            <a href="{% url 'profile' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
