{% extends "base.html" %}

{% block title %}Password reset complete — CodeQuest{% endblock %}

{% block content %}
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <a href="{% url 'home' %}" class="brand" aria-label="CodeQuest home">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    </span>
                    <span class="brand-text">Code<span class="brand-accent">Quest</span></span>
                </a>
            </div>

            <h1 class="auth-title">Password reset complete</h1>
            <p class="auth-subtitle">Your password has been set. You can now log in with your new password.</p>

            <a href="{% url 'login' %}" class="btn btn-block btn-lg">Log in</a>
        </div>
    </div>
{% endblock %}
