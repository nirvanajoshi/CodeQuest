{% extends "base.html" %}

{% block title %}Register — CodeQuest{% endblock %}

{% block content %}
    <h1>Create an account</h1>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
