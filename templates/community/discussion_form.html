{% extends "base.html" %}

{% block title %}New Discussion — {{ course.title }} — CodeQuest{% endblock %}

{% block content %}
    <p><a href="{% url 'discussion_list' course.slug %}" class="card-link">&larr; Back to discussions</a></p>

    <header class="page-header">
        <div>
            <h1 class="page-title">Start a discussion</h1>
            <p class="page-subtitle">Ask a question or share something interesting with the class.</p>
        </div>
    </header>

    <form method="post" class="form panel" style="max-width: 720px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Post</button>
    </form>
{% endblock %}
