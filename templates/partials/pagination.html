{% if page_obj.has_other_pages %}
    <nav class="pagination" aria-label="Pagination">
        {% if page_obj.has_previous %}
            <a href="?page={{ page_obj.previous_page_number }}{% if querystring %}&amp;{{ querystring }}{% endif %}" rel="prev">&laquo; Prev</a>
        {% endif %}
        <span class="pagination-current">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}{% if querystring %}&amp;{{ querystring }}{% endif %}" rel="next">Next &raquo;</a>
        {% endif %}
    </nav>
{% endif %}
